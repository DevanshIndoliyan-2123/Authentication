# ==========================================
# Application
# ==========================================
spring.application.name=Authentication_System

# ==========================================
# Database Configuration - Supabase
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JWT Authentication
# ==========================================
jwt.secret=${JWT_SECRET}
# NEW: token lifetime (10 hours)
jwt.expiration-ms=36000000

# NEW: key used to hash OTPs (defaults to the JWT secret)
otp.secret=${OTP_SECRET:${jwt.secret}}

# ==========================================
# Gmail SMTP - Primary
# ==========================================
app.mail.connection-timeout-ms=5000
app.mail.read-timeout-ms=10000
app.mail.write-timeout-ms=10000

app.mail.gmail.host=smtp.gmail.com
app.mail.gmail.port=587
app.mail.gmail.username=${GMAIL_USERNAME:}
app.mail.gmail.password=${GMAIL_APP_PASSWORD:}
app.mail.gmail.from=${GMAIL_FROM:}

# ==========================================
# Brevo SMTP - Fallback
# ==========================================
app.mail.brevo.host=smtp-relay.brevo.com
app.mail.brevo.port=2525
app.mail.brevo.username=${BREVO_SMTP_USERNAME:}
app.mail.brevo.password=${BREVO_SMTP_KEY:}
app.mail.brevo.from=${BREVO_FROM:}

# ==========================================
# HikariCP Connection Pool
# ==========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=300000

# ==========================================
# JPA Settings
# ==========================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# NEW: CORS - allowed frontend origins (comma-separated)
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================================
# NEW: Flyway - baseline lets V1 run on your existing tbl_users table
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0