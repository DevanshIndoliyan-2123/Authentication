# Production environment
server.port=8081

# Flyway creates and updates the schema; Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Behind a reverse proxy (Nginx, Render, Railway...) so the client IP used by
# the rate limiter comes from X-Forwarded-For. Remove if the app is exposed directly.
server.forward-headers-strategy=native

# Set CORS_ALLOWED_ORIGINS to the deployed frontend URL(s), e.g. https://app.example.com

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
