# Test profile: in-memory H2, no Flyway, no real SMTP
spring.datasource.url=jdbc:h2:mem:authtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=test-secret-key-that-is-at-least-32-characters-long
otp.secret=test-otp-secret-key
app.cors.allowed-origins=http://localhost:5173

app.mail.gmail.host=smtp.example.test
app.mail.gmail.username=test@example.test
app.mail.gmail.password=dummy
app.mail.gmail.from=test@example.test
